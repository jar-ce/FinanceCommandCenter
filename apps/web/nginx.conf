# ==============================================================================
# FINANCE COMMAND CENTER (APEX OS) — FRONTEND NGINX CONFIGURATION
# Production static SPA distribution with reverse proxy & security headers
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (SEC-02 Compliance)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:4000 https://api.yourdomain.com;" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # HTML5 PushState Fallback Routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
        # Ensure index.html is never aggressively cached by browsers
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static Immutable Hashed Assets (JS, CSS, Images, Fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse Proxy API Requests to Backend Service
    location /api/v1/ {
        proxy_pass http://api:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health Probe for Frontend Container
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
