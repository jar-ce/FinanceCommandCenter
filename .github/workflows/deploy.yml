name: Finance Command Center APEX OS CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate-and-deploy:
    name: Validate, Migrate & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. CI Validation Gate — Type Check
        run: npm run type-check

      - name: 2. CI Validation Gate — Test Suite
        run: npm run test

      - name: 3. CI Validation Gate — Production Build
        run: npm run build

      - name: 4. CI Validation Gate — Security Audit
        run: npm audit --audit-level=high

      - name: 5. Execute Pre-Deployment Database Migrations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_SSL: 'true'
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
        run: |
          echo "Running database migration task against production database target..."
          npm run db:migrate --workspace=@finance-command-center/api

      - name: 6. Build Container & Release Artifacts
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::8}"
          echo "Compiling release artifacts tagged with commit ${IMAGE_TAG}..."

      - name: 7. Post-Deployment Readiness Smoke Check
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          echo "Verifying API health and readiness probes..."
          # Probe liveness and readiness endpoints if live deployment target URL is configured
          if [ -n "$API_URL" ]; then
            curl --fail --retry 3 --retry-delay 5 "${API_URL}/health/readiness" || exit 1
            echo "✅ Post-deployment readiness probe passed cleanly."
          else
            echo "ℹ️ Live deployment target URL not configured; skipping remote HTTP ping."
          fi
